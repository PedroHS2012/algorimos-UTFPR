<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>CRUD Pessoas</title>
</head>

<body>
    <label for='inputReferencia'>CPF:(É invariavel, se errar, exclua e crie outro elemento)</label> <br>
    <input type='number' id='inputReferencia'>
    <input type='button' value='Procure' id='btProcure' onclick='procure()' style='display:inline;'>
    <input type='button' value='Inserir' id='btInserir' onclick='inserir()' style='display:none;'>
    <input type='button' value='Alterar' id='btAlterar' onclick='alterar()' style='display:none;'>
    <input type='button' value='Excluir' id='btExcluir' onclick='excluir()' style='display:none;'>
    <input type='button' value='Voltar' id='btVoltar' onclick='voltar()' style='display:none;'>
    <br><br>
    <label for='inputnome'>nome:</label>
    <input type='text' id='inputnome' readonly='true'>
    <br>
    <label for='inputidade'>idade:</label>
    <input type='number' id='inputidade' readonly='true'>
    <br>
    <label for='inputpeso'>peso:</label>
    <input type='number' id='inputpeso' readonly='true'>
    <br>
    <label for='inputaltura'>altura:</label>
    <input type='number' id='inputaltura' readonly='true'>
    <br>
    <br>
    <br><br>
    <div id='divAviso' style='background-color: antiquewhite;'></div>
    <br>
    <input type='button' value='Salvar' id='btSalvar' onclick='salvar()' style='display:none;'>
    <input type='button' value='Cancelar' id='btCancelar' onclick='cancelarOperacao()' style='display:none;'>
    <br><br>
    <div id='outputSaida' style='background-color: aqua;'>...</div>
         <input type="button" value="Persistir" id="btPersisitir" onclick="prepararESalvarCSV()">
   <input type="button" value="Recuperar" id="btRecuperar" onclick="abrirArquivoSalvoEmLocalPermanente()">
    <script>
class Pessoas{
constructor(CPF, nome, idade, peso, altura){
this.CPF = CPF;
this.nome = nome;
this.idade = idade;
this.peso = peso;
this.altura = altura;
}
}

    </script>
    <script>
        let lista = [];
        let alterado = null;
        function procure() {
            let CPF = parseFloat(document.getElementById('inputReferencia').value);
            let item = null;
            if (isNaN(CPF)) {
                alert('coloque uma referencia');
                return
            }
            document.getElementById('inputReferencia').readOnly = true;
            for (let i = 0; i < lista.length; i++) {
                if (lista[i].CPF == CPF) {
                    item = lista[i];
                    document.getElementById('inputnome').value = item.nome;
                    document.getElementById('inputidade').value = item.idade;
                    document.getElementById('inputpeso').value = item.peso;
                    document.getElementById('inputaltura').value = item.altura;
                    document.getElementById('divAviso').innerHTML = 'Produto encontrado, clique Alterar para alterar';
                    document.getElementById('btAlterar').style.display = 'inline';
                    document.getElementById('btExcluir').style.display = 'inline';
                    break
                }
            }
            if (item == null) {
                document.getElementById('divAviso').innerHTML = 'Produto nao encontrado, clique inserir para adicionar';
                document.getElementById('btInserir').style.display = 'inline';
            }
            item = null;
            document.getElementById('btProcure').style.display = 'none';
            document.getElementById('inputnome').readOnly = false;
            document.getElementById('inputidade').readOnly = false;
            document.getElementById('inputpeso').readOnly = false;
            document.getElementById('inputaltura').readOnly = false;
            document.getElementById('btVoltar').style.display = 'inline';
        }
        function inserir() {
            let referencial = document.getElementById('inputReferencia').value;
            let a1C = document.getElementById('inputnome').value;
            let a2C = parseFloat(document.getElementById('inputidade').value);
            let a3C = parseFloat(document.getElementById('inputpeso').value);
            let a4C = parseFloat(document.getElementById('inputaltura').value);
            if (referencial == '' || isNaN(referencial) || a1C == '' || isNaN(a2C) || isNaN(a3C) || isNaN(a4C)) {
                alert('insira todos os parametros');
                return;
            }
            fInserir(referencial, a1C, a2C, a3C, a4C, lista)
            document.getElementById('divAviso').innerHTML = 'Produto adicionado';
            exibirLista(lista);
            zerar();
            document.getElementById('btVoltar').style.display = 'none';
        }
        function fInserir(referencial, a1C, a2C, a3C, a4C, lista) {
            let itens = new Pessoas(referencial, a1C, a2C, a3C, a4C,);
            lista.push(itens);
        }
        function exibirLista(lista) {
            let string = '';
            document.getElementById('outputSaida').innerHTML = '';
            for (let i = 0; i < lista.length; i++) {
                string += 'CPF: ' + lista[i].CPF + ' <br> ' + 'nome: ' + lista[i].nome + ' <br> ' + 'idade: ' + lista[i].idade + ' <br> ' + 'peso: ' + lista[i].peso + ' <br> ' + 'altura: ' + lista[i].altura + ' <br> ' + '-----------------------------------------------------------------------------<br>';
            }
            document.getElementById('outputSaida').innerHTML = string;
        }
        function alterar() {
            let referencial = document.getElementById('inputReferencia').value;
            let a1C = document.getElementById('inputnome').value;
            let a2C = parseFloat(document.getElementById('inputidade').value);
            let a3C = parseFloat(document.getElementById('inputpeso').value);
            let a4C = parseFloat(document.getElementById('inputaltura').value);
            if (a1C == '' || isNaN(a2C) || isNaN(a3C) || isNaN(a4C)) {
                alert('insira todos os parametros');
                return;
            }
            for (let i = 0; i < lista.length; i++) {
                if (referencial == lista[i].CPF) {
                    let itemQuestao = lista[i];
                    itemQuestao.nome = a1C;
                    itemQuestao.idade = a2C;
                    itemQuestao.peso = a3C;
                    itemQuestao.altura = a4C;
                    break
                }
            }
            exibirLista(lista);
            zerar();
            document.getElementById('btVoltar').style.display = 'none';
            document.getElementById('divAviso').innerHTML = 'Produto Alterado';
        }
        function zerar() {
            document.getElementById('inputnome').readOnly = true;
            document.getElementById('inputnome').value = '';
            document.getElementById('inputidade').readOnly = true;
            document.getElementById('inputidade').value = '';
            document.getElementById('inputpeso').readOnly = true;
            document.getElementById('inputpeso').value = '';
            document.getElementById('inputaltura').readOnly = true;
            document.getElementById('inputaltura').value = '';
            document.getElementById('inputReferencia').readOnly = false;
            document.getElementById('inputReferencia').value = '';
            document.getElementById('btProcure').style.display = 'inline';
            document.getElementById('btExcluir').style.display = 'none';
            document.getElementById('btAlterar').style.display = 'none';
            document.getElementById('btInserir').style.display = 'none';
        }
        function excluir() {
            let referencial = document.getElementById('inputReferencia').value;
            if (referencial == '' || isNaN(referencial)) {
                alert('coloque uma referencia valida');
                return;
            }
            lista = fExcluir(referencial, lista);
            exibirLista(lista);
            zerar();
            document.getElementById('btVoltar').style.display = 'inline';
            document.getElementById('divAviso').innerHTML = 'Produto EXCLUIDO, clique VOLTAR para desfazer';
            document.getElementById('btVoltar').value = 'Desfazer';
        }
        function fExcluir(referencial, lista) {
            let newlista = [];
            for (let i = 0; i < lista.length; i++) {
                if (lista[i].CPF != referencial) {
                    newlista.push(lista[i]);
                } else {
                    alterado = lista[i];
                }
            }
            return newlista;
        }
        function voltar() {
            if (alterado != null) {
                fInserir(alterado.CPF, alterado.nome, alterado.idade, alterado.peso, alterado.altura, lista);
                document.getElementById('divAviso').innerHTML = 'Produto reenserido';
            }
            exibirLista(lista);
            zerar();
            document.getElementById('btVoltar').style.display = 'none';
            document.getElementById('btVoltar').value = 'Voltar';
            alterado = null;
        }
        function persistirEmLocalPermanente(arquivoDestino, conteudo) {
            const blob = new Blob([conteudo], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = arquivoDestino;
            link.click();
            URL.revokeObjectURL(link.href);
        }
        function abrirArquivoSalvoEmLocalPermanente() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = function (event) {
                const arquivo = event.target.files[0];
                if (arquivo) {
                    converterDeCSVparaListaObjeto(arquivo);
                }
            };
            input.click();
        }
        function prepararESalvarCSV() {
            let nomeDoArquivoDestino = 'Pessoas.csv';
            let textoCSV = '';
            for (let i = 0; i < lista.length; i++) {
                const linha = lista[i];
                textoCSV += linha.CPF + ';' + linha.nome + ';' + linha.idade + ';' + linha.peso + ';' + linha.altura + '\n';
            }
            persistirEmLocalPermanente(nomeDoArquivoDestino, textoCSV);
        }
        function converterDeCSVparaListaObjeto(arquivo) {
            const leitor = new FileReader();
            leitor.onload = function (e) {
                const conteudo = e.target.result;
                const linhas = conteudo.split('\n');
                lista = [];
                for (let i = 0; i < linhas.length; i++) {
                    const linha = linhas[i].trim();
                    if (linha) {
                        const dados = linha.split(';');
                        let novoPessoas = new Pessoas(
                            parseFloat(dados[0]),
                            dados[1],
                            parseFloat(dados[2]),
                            parseFloat(dados[3]),
                            parseFloat(dados[4]),
                        );
                        lista.push(novoPessoas);
                    }
                }
                exibirLista(lista);
                document.getElementById('divAviso').innerHTML = 'Arquivo carregado com sucesso!';
            };
            leitor.readAsText(arquivo);
        }

    </script>
</body>

</html>
