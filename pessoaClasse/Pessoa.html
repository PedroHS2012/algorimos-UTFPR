        //ex 3
        function listarTodasAsPessoas() {
            let lp = mostrarListaPessoas(listaPessoas);
            document.getElementById("saida").innerHTML = lp;
        }
        function mostrarListaPessoas(listaPessoas) {
            let listagem = "<br>";
            for (let i = 0; i < listaPessoas.length; i++) {
                let linha = listaPessoas[i];
                listagem += linha.nome + " - " + linha.idade + " anos" + "<br>";
            }
            return listagem;
        }

        //ex 4
        function mostrarMaisVelho() {
            let lp = maisVelho(listaPessoas);
            document.getElementById("saida").innerHTML = lp;
        }
        function maisVelho(listaPessoas) {
            let mais = 0;
            for (let i = 1; i < listaPessoas.length; i++) {
                if (listaPessoas[i].idade > listaPessoas[mais].idade) {
                    mais = i;
                }
            }
            let string = listaPessoas[mais].nome + " - " + listaPessoas[mais].idade + " anos";
            return string
        }

        //ex 8
        function mostrarMediaIdade() {
            let lp = mediaIdade(listaPessoas);
            document.getElementById("saida").innerHTML = lp;
        }
        function mediaIdade(listaPessoas) {
            let soma = 0;
            for (let i = 0; i < listaPessoas.length; i++) {
                soma = soma + listaPessoas[i].idade;
            }
            let med = soma / listaPessoas.length;
            return "Média des idades: " + med.toFixed(2) + " anos";
        }

        //ex 9
        function mostrarMediaPesos() {

        }
        function mediaPeso(listaPessoas) {
            let soma = 0;
            for (let i = 0; i < listaPessoas.length; i++) {
                soma = soma + listaPessoas[i].peso;
            }
            let med = soma / listaPessoas.length;
            return "Média dos pesos: " + med.toFixed(2) + "kg";
        }

        //ex 10
        function mostrarAcima50Anos() {
            let lp = acima50(listaPessoas);
            document.getElementById("saida").innerHTML = lp;

        }
        function acima50(listaPessoas) {
            let string = "";
            for (let i = 0; i < listaPessoas.length; i++) {
                if (listaPessoas[i].idade >= 50) {
                    string += listaPessoas[i].nome + " - " + listaPessoas[i].idade + " anos<br>";
                }
            }
            return string;
        }

        //ex 11
        function mostrarFiltroConvenio() {
            let convenios = document.getElementById("inputFiltroConvenio").value;
            document.getElementById("saida").innerHTML = filtroConvenio(listaPessoas, convenios);
        }
        function filtroConvenio(listaPessoas, convenios) {
            let string = "";
            let aux = 0;
            for (let i = 0; i < listaPessoas.length; i++) {
                if (listaPessoas[i].convenio == convenios) {
                    string += listaPessoas[i].nome + " - " + listaPessoas[i].convenio + "<br>";
                    aux++
                }
            }
            if (aux == 0) {
                alert("convenio Nao Encontrado");
            }
            return aux + " pessoas encontradas: <br>" + string;
        }

        //ex 12
        function mostrarFiltroNome() {
            let nomes = document.getElementById("inputFiltroNome").value;
            document.getElementById("saida").innerHTML = filtroNome(listaPessoas, nomes);
        }
        function filtroNome(listaPessoas, nomes) {
            let string = "";
            let aux = -67;
            for (let i = 0; i < listaPessoas.length; i++) {
                if (listaPessoas[i].nome == nomes) {
                    string += listaPessoas[i].id + " - " + listaPessoas[i].nome + " - " + listaPessoas[i].convenio + " - " + listaPessoas[i].idade + " anos - " + listaPessoas[i].peso + "Kg - " + listaPessoas[i].altura + "m";
                    aux = 67;
                }
            }
            if (aux == -67) {
                alert("Pessoa Nao Encontrada");
                return " ";
            }
            return string;
        }

        //ex 13
        function mostrarIMC() {
            document.getElementById("saida").innerHTML = IMC(listaPessoas);
        }
        function IMC(listaPessoas) {
            let imc = 0;
            let classificacao = "";
            let string = "";
            for (let i = 0; i < listaPessoas.length; i++) {
                imc = (listaPessoas[i].peso / (listaPessoas[i].altura ** 2)).toFixed(1);
                if (imc <= 18.5) {
                    classificacao = "Abaixo do Peso";
                } else if (imc <= 24.9) {
                    classificacao = "Peso Normal";
                } else if (imc <= 29.9) {
                    classificacao = "Sobrepeso";
                } else if (imc <= 34.9) {
                    classificacao = "Obesidade Grau I";
                } else if (imc <= 39.9) {
                    classificacao = "Obesidade Grau II";
                } else {
                    classificacao = "Obesidade Grau III (Mórbida)";
                }
                string += listaPessoas[i].nome + " - " + listaPessoas[i].peso + " - imc: " + imc + " - " + classificacao + "<br>";
            }
            return string;
        }
