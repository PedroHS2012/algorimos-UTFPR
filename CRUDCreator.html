<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>CRUD CREATOR</title>
</head>

<body>
    <h1>Criador de CRUD</h1><br>
    <input type='text' id='nomeClasse' placeholder='Coloque o nome da classe'><br>
    <textarea cols='50' rows='20' type='text' id='inputAtributos'
        placeholder='Coloque os atributos e seus tipos'></textarea><br>
    <button onclick='criar()'>Criar</button><br>
    <textarea cols='50' rows='20' type='text' id='saidaHTML' readonly='true'></textarea>

            let atributos = document.getElementById('inputAtributos').value

                "</head>\n" +

            }

                "exibirLista(lista);\n" +
                "zerar();\n" +
                "document.getElementById('btVoltar').style.display = 'none';\n" +

                "}\n" +
                "function fInserir(referencial,"
            for (let i = 1; i < atributos.length; i++) {
                string += " a" + i + "C,"
            }
            string += " lista) {\n" +
                "let itens = new " + nome + "(referencial,"
            for (let i = 1; i < atributos.length; i++) {
                string += " a" + i + "C,"
            }
            string += ");\n" +
                "lista.push(itens);\n" +

                "}\n" +
                "function exibirLista(lista) {\n" +
                "let string = '';\n" +
                "document.getElementById('outputSaida').innerHTML = '';\n" +
                "for (let i = 0; i < lista.length; i++) {\n"
            string += "string += " +
                atributos.map(a =>

                ).join(" + ") +
                " + '-----------------------------------------------------------------------------<br>';\n" +
                "}\n" +
                "document.getElementById('outputSaida').innerHTML = string;\n" +
                "}\n" +

            for (let i = 1; i < atributos.length; i++) {

                } else if (atributos[i][0] == "int") {
                    string += "let a" + i + "C = parseInt(document.getElementById('input" + atributos[i][1] + "').value);\n"
                } else if (atributos[i][0] == "text") {
                    string += "let a" + i + "C = document.getElementById('input" + atributos[i][1] + "').value;\n"
                } else {
                    string += "let a" + i + "C = document.getElementById('input" + atributos[i][1] + "').value;\n"
                }
            }
            if (atributos.length > 1) {

                    if (atributos[i][0] == "float" || atributos[i][0] == "int") {
                        condicoesAlterar.push("isNaN(a" + i + "C)");
                    } else if (atributos[i][0] == "text") {

                string += "if (" + condicoesAlterar.join(" || ") + ") {\n" +
                    "alert('insira todos os parametros');\n" +

                "if (referencial == lista[i]." + referencial + ") {\n" +

            string += "break\n" +

            for (let i = 1; i < atributos.length; i++) {

                "document.getElementById('btProcure').style.display = 'inline';\n" +
                "document.getElementById('btExcluir').style.display = 'none';\n" +
                "document.getElementById('btAlterar').style.display = 'none';\n" +
                "document.getElementById('btInserir').style.display = 'none';\n" +


                "}\n" +

                "function excluir() {\n" +
                "let referencial = document.getElementById('inputReferencia').value;\n";

                "document.getElementById('divAviso').innerHTML = 'Produto EXCLUIDO, clique VOLTAR para desfazer';\n" +
                "document.getElementById('btVoltar').value = 'Desfazer';\n" +

                "}\n" +
                "function fExcluir(referencial, lista) {\n" +
                "let newlista = [];\n" +
                "for (let i = 0; i < lista.length; i++) {\n" +
                "if (lista[i]." + referencial + " != referencial) {\n" +
                "newlista.push(lista[i]);\n" +
                "} else {\n" +
                "alterado = lista[i];\n" +
                "}\n" +
                "}\n" +
                "return newlista;\n" +
                "}\n" +

                "function voltar() {\n" +
                "if(alterado != null){\n" +
                "fInserir(";
            for (let i = 0; i < atributos.length; i++) {
                string += " alterado." + atributos[i][1] + ",";
            }

                "}\n" +

                "const link = document.createElement('a');\n" +
                "link.href = URL.createObjectURL(blob);\n" +
                "link.download = arquivoDestino;\n" +
                "link.click();\n" +
                "URL.revokeObjectURL(link.href);\n" +
                "}\n" +

                "function abrirArquivoSalvoEmLocalPermanente() {\n" +

                "const input = document.createElement('input');\n" +
                "input.type = 'file';\n" +
                "input.accept = '.csv';\n" +
                "input.onchange = function (event) {\n" +
                "const arquivo = event.target.files[0];\n" +
                "if (arquivo) {\n" +
                "converterDeCSVparaListaObjeto(arquivo);\n" +
                "}\n" +
                "};\n" +
                "input.click();\n" +
